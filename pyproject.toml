[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-ontology-baseline"
version = "0.1.0"
description = "Evidence-grounded C++ business ontology extraction with Joern and an OpenAI-compatible LLM"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7", "pydantic>=2.8,<3", "ijson>=3.3,<4"]

[project.scripts]
code-ontology = "code_ontology.cli:main"

[tool.setuptools.packages.find]
include = ["code_ontology*"]

[tool.setuptools.package-data]
code_ontology = ["resources/**/*.txt", "resources/*.yaml", "resources/*.sc", "resources/viewer/*.html", "resources/viewer/*.css", "resources/viewer/*.js", "resources/workbench/*.html", "resources/workbench/*.css", "resources/workbench/*.js"]
